name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12 enforces the package.json allowScripts policy; Node 24 bundles npm 11.
      - name: Use npm 12
        run: npm install -g npm@12.2.2

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unused code and dependencies
        run: npm run check:deps

      - name: Unit tests
        run: npm test -- --runInBand

      - name: End-to-end (builds, then launches the real Electron app)
        run: npm run test:e2e

      - name: Package unpacked app
        run: npx electron-builder --dir --publish never

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
